services:
  api:
    build: ./backend
    command: sh -c "alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    volumes:
      - ./backend:/app
      - uploads:/app/private_uploads
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: ./backend
    command: rq worker --url redis://redis:6379/0 default
    env_file: .env
    volumes:
      - ./backend:/app
      - uploads:/app/private_uploads
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dataready
      POSTGRES_USER: dataready
      POSTGRES_PASSWORD: dataready
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataready -d dataready"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes: ["./frontend:/app", "frontend_node_modules:/app/node_modules"]
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
  uploads:
  frontend_node_modules:
